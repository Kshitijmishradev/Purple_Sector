; Four processes that are four containers in docker-compose.yml.
;
; Start order is expressed with priority, but priority alone does not wait for
; readiness -- so the two dependants (api, consumer) block on the broker
; themselves rather than assuming it is up. The consumer already retries the
; broker for 60s on its own; the API is wrapped in a wait in entrypoint.sh.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Lets `supervisorctl -c <this file> status` work inside the container, which
; is the fastest way to tell a crashed process from a slow one.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
priority=10
command=redis-server
    --bind 127.0.0.1
    --port 6379
    --save ""
    --maxmemory 256mb
    --maxmemory-policy allkeys-lru
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redpanda]
priority=10
; Launch through rpk, not the redpanda binary. docker-compose.yml's
; `redpanda start ...` is rpk's CLI -- flags like --check and
; --unsafe-bypass-fsync belong to rpk and the raw binary rejects them.
;
; --smp=1 and a modest memory ceiling because this shares a box with pandas;
; a broker that does not need a JVM is the whole reason Redpanda is here.
; --unsafe-bypass-fsync: this holds an in-flight replay and nothing else.
; Durability across a restart is not a property we need or want to pay for.
command=/opt/redpanda/bin/rpk redpanda start
    --overprovisioned
    --smp=1
    --memory=768M
    --reserve-memory=0M
    --node-id=0
    --check=false
    --unsafe-bypass-fsync=true
    --kafka-addr=PLAINTEXT://127.0.0.1:9092
    --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
    --rpc-addr=127.0.0.1:33145
    --advertise-rpc-addr=127.0.0.1:33145
; Redpanda takes ~10s to become healthy; without this supervisor counts a
; slow-but-fine start as a failure and burns its retries before it is up.
startsecs=15
startretries=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
priority=20
directory=/app
command=/usr/local/bin/python -m uvicorn src.main:app --host 0.0.0.0 --port 7860
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:consumer]
priority=20
directory=/app
command=/usr/local/bin/python -m src.stream.consumer
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
