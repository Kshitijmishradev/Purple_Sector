services:
  - type: web
    name: purple-sector-mvp-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-demo.txt
    startCommand: uvicorn demo_api:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
